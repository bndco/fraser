<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fraser - O buscador fraterno</title>
  <style>
    /* Seus estilos CSS permanecem os mesmos */
    body { font-family: Arial, sans-serif; }
    .result-item { max-width:600px; min-width:50%; border-radius: 2px; box-shadow: inset 20px 30px 10px rgba(255, 255, 255, 0.841); margin-left: 130px; border-bottom: 3px solid rgba(240, 244, 246, 0.538); padding-bottom: 4px; margin-bottom: 20px;}
    .highlight { color: rgb(39, 111, 112); font-weight: bold; }
    .result-link { position: relative; top:-10px; color: blue; text-decoration: underline; font-size: 13px;}
    .result-description { font-size: 12px; color: SlateGrey; }
    h2{ font-size: 43px; text-align: center; }
    h3{ font-size: 16px; padding-top: 14px; }
    h2.purp{ color: rgb(39, 111, 112); }
    hr { border-color: rgb(64, 175, 160); }
    #searchInput { width: 300px; padding: 5px; margin: 10px 0; border: 2px solid #ccc; border-radius: 5px; }
    #searchButton { padding: 5px 15px; background-color: #2691a1; border: none; border-radius: 5px; color: #fff; cursor: pointer; }
    #results-count { font-size: 12px; color: rgba(69, 119, 126, 0.732); font-weight: bold; }
  </style>
</head>
<body>
<center><img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEixnbPzDWeNvsDsQsEOrKyTQkWlbJVe8vAW_S1C6ZJFQKiKkwhaYLlOrgB8EZvIrd_9J4GzyfeMq6TrDCoav7zUtmG6PCrECb5d3jOweoW4CzBNuF7O4FAiOsVOMkA_FtwwbRQbwLyaWyijsiDhwpJCqKsZBlGnSaJjrW0xMyu4-R94KIOYH38vLuvr/w446-h446/frasear-logo.jpg"></center><p>
<h2 class="purp">Frasear</h2>
<div style="text-align: center;">
  Welcome
  <hr>
  <input type="text" id="searchInput" placeholder="Digite aqui para buscar...">
  <button id="searchButton">Pesquisar</button>
  <div id="results-count">Total de 0 resultado(s) encontrado(s)</div>
</div>

<div id="results"></div>
<hr>
<footer>2026 Frasear Buscador. </footer>
<script>
    // 1. DEFINIÇÃO DAS VARIÁVEIS GLOBAIS
    const searchInput = document.getElementById('searchInput');
    const searchButton = document.getElementById('searchButton');
    const resultsContainer = document.getElementById('results');
    let dataItems = []; 

    // 2. FUNÇÃO PARA CARREGAR OS DADOS (DOIS JSONs)
    async function loadData() {
      try {
        const [res1, res2] = await Promise.all([
          fetch('bmus.json'),
          fetch('busca013.json')
        ]);

        const data1 = await res1.json();
        const data2 = await res2.json();

        dataItems = [...data1, ...data2];
        console.log("Dados carregados. Total:", dataItems.length);
      } catch (error) {
        console.error('Erro ao carregar os dados:', error);
      }
    }

    // 3. FUNÇÃO DE DESTAQUE (HIGHLIGHT)
    function highlightMatches(text, queryWords) {
      if (!text) return "";
      let highlightedText = text;
      queryWords.forEach(word => {
        if (word.length > 0) {
          const regex = new RegExp(`(?<!<[^>]*)(${word})(?![^<]*>)`, 'gi');
          highlightedText = highlightedText.replace(regex, '<span class="highlight">$1</span>');
        }
      });
      return highlightedText;
    }

    // 4. FUNÇÃO DE BUSCA
    function search() {
      const query = searchInput.value.toLowerCase().trim();
      resultsContainer.innerHTML = ''; 

      if (query) {
        const queryWords = query.split(/\s+/);
        const filteredItems = dataItems.filter(item => {
          const searchableText = `${item.title} ${item.content} ${item.description}`.toLowerCase();
          return queryWords.every(word => searchableText.includes(word));
        });

        document.getElementById("results-count").textContent = `Total de ${filteredItems.length} resultado(s) encontrado(s).`;

        if (filteredItems.length > 0) {
          filteredItems.forEach(item => {
            const resultItem = document.createElement('div');
            resultItem.classList.add('result-item');

            resultItem.innerHTML = `
              <h3>${highlightMatches(item.title, queryWords)}</h3>
              <span class="result-description">${item.description || ''}</span>
              <p>${highlightMatches(item.content, queryWords)}</p>
              <a href="${item.url}" target="_blank" class="result-link">${item.url}</a>
            `;
            resultsContainer.appendChild(resultItem);
          });
        } else {
          resultsContainer.innerHTML = '<div>Nenhum resultado encontrado.</div>';
        }
      } else {
        document.getElementById("results-count").textContent = "Total de 0 resultado(s) encontrado(s).";
        resultsContainer.innerHTML = '<div>Por favor, digite um termo de busca.</div>';
      }
    }

    // 5. BLOCO DE INICIALIZAÇÃO (O "Gatilho")
    loadData().then(() => {
      searchButton.addEventListener('click', search);
      searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') search();
      });
    });
</script>

</body>
</html>
